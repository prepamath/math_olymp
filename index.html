<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympiades & Concours Général - Collège</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">

    <!-- KaTeX, MathLive & Supabase -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script defer src="https://unpkg.com/mathlive@0.111.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0"></script>

    <!-- Notre feuille de style séparée -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 1. ÉCRAN DE CONNEXION -->
<div id="login-screen">
    <div class="login-card">
        <div class="nav-brand" style="justify-content: center; margin-bottom: 10px;">
            Math<span>Olympiades</span>
        </div>
        <h1>Connexion</h1>
        <p>Entrez l'identifiant fourni par votre professeur.</p>

        <form id="login-form" onsubmit="tentativeConnexion(event); return false;">
            <div class="form-group">
                <label>Identifiant</label>
                <input type="text" id="login-id" class="form-input" placeholder="ex: eleve01" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="login-pwd" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-primary" id="login-btn">Accéder à l'entraînement</button>
            <div id="login-error" class="feedback-box incorrect"></div>
        </form>
    </div>
</div>

<!-- 2. APPLICATION PRINCIPALE -->
<div id="app-screen">
    <nav class="navbar">
        <div class="navbar-inner">
        <div class="nav-brand" onclick="afficherSection(sectionActuelle)">
            Math<span>Olympiades</span>
        </div>
        <div class="nav-sections" id="nav-sections"></div>
        <div class="nav-user">
            <!-- Bouton visible uniquement si connecté avec "prof" -->
            <button id="btn-admin" class="nav-btn admin-btn" style="display:none;" onclick="ouvrirPanneauProf()">⚙️ Mode Prof</button>
            <span id="user-display" style="color: var(--text-muted);"></span>
            <span class="score-badge" id="score-display">0 pt</span>
            <button class="logout-btn" onclick="seDeconnecter()">Déconnexion</button>
        </div>
        </div>
    </nav>

    <div class="container" id="main-container"></div>
</div>

<!-- Notre script d'application séparé -->
<script src="app.js"></script>
</body>
</html>
